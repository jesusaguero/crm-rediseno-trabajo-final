<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BM&L · Órdenes de trabajo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="css/styles.css" rel="stylesheet" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar">
      <h1 class="topbar-title">Órdenes de trabajo</h1>
      <div class="topbar-search"><input id="ordenSearch" placeholder="Buscar órdenes..." /></div>
    </header>
    <section class="page">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div>
          <h2 class="page-title">Órdenes de trabajo</h2>
          <p class="text-muted mb-0 small"><span id="countTotal">16</span> órdenes · <span class="text-danger">6 estancadas</span> · <span class="text-warning">8 urgentes</span></p>
        </div>
        <a href="nuevo-candidato.html" class="btn btn-primary-senda">+ Nueva orden</a>
      </div>

      <div class="row g-3">
        <div class="col-lg-3">
          <div class="panel filter-panel">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <strong>≡ Filtros</strong>
              <a href="#" id="clearFilters" class="link-muted small">Limpiar</a>
            </div>
            <div class="filter-group">
              <div class="filter-title">PRIORIDAD</div>
              <div id="filterPriority"></div>
            </div>
            <div class="filter-group">
              <div class="filter-title">ESTADO</div>
              <div id="filterState"></div>
            </div>
            <div class="filter-group">
              <div class="filter-title">RECLUTADOR</div>
              <div id="filterRecruiter"></div>
            </div>
            <div class="filter-group">
              <div class="filter-title">COMPAÑÍA</div>
              <div id="filterCompany"></div>
            </div>
          </div>
        </div>
        <div class="col-lg-9">
          <div class="panel p-0">
            <table class="orders-table">
              <thead>
                <tr>
                  <th>ORDEN</th><th>EMPRESA</th><th>RECLUTADOR</th><th>PRIORIDAD</th><th>EN PROC.</th><th>DÍAS ABIERTA</th><th></th>
                </tr>
              </thead>
              <tbody id="ordersBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
<script src="js/app.js"></script>
<script>renderSidebar('ordenes'); renderOrdenes();</script>
</body>
</html>
