<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BM&L · Candidatos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="css/styles.css" rel="stylesheet" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar">
      <h1 class="topbar-title">&nbsp;</h1>
      <div class="topbar-search"><input id="candSearch" placeholder="Buscar candidatos, órdenes..." /></div>
    </header>
    <section class="page">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div>
          <h2 class="page-title">Candidatos</h2>
          <p class="text-muted mb-0 small"><span id="candCount">16</span> resultados</p>
        </div>
        <a href="nuevo-candidato.html" class="btn btn-primary-senda">👤+ Nuevo candidato</a>
      </div>

      <div class="row g-3">
        <div class="col-lg-3">
          <div class="panel filter-panel">
            <div class="mb-3"><input id="candSideSearch" class="form-control form-control-sm" placeholder="Buscar nombre o skill..." /></div>
            <div class="d-flex justify-content-between align-items-center mb-3">
              <strong>≡ Filtros</strong>
              <a href="#" id="candClear" class="link-muted small">Limpiar</a>
            </div>
            <div class="filter-group"><div class="filter-title">PERFIL</div><div id="filterProfile"></div></div>
            <div class="filter-group"><div class="filter-title">DISPONIBILIDAD</div><div id="filterAvail"></div></div>
            <div class="filter-group"><div class="filter-title">RECLUTADOR</div><div id="filterCandRecruiter"></div></div>
            <div class="filter-group"><div class="filter-title">ORIGEN</div><div id="filterSource"></div></div>
          </div>
        </div>
        <div class="col-lg-9">
          <div class="row g-3" id="candidatesGrid"></div>
        </div>
      </div>
    </section>
  </main>
</div>
<script src="js/app.js"></script>
<script>renderSidebar('candidatos'); renderCandidatos();</script>
</body>
</html>
